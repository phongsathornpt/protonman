name: Desktop runtime UI finish

on:
  push:
    branches: [feat/desktop-app]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/desktop-app
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply and test runtime controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path); text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace("internal/feature/desktop/state.go",
              '// SessionContextState contains inspectable durable goal, TODO, and memory state.\ntype SessionContextState struct {\n',
              '// RuntimeSettingsState is the reducer-owned session runtime selection.\ntype RuntimeSettingsState struct {\n\tProvider       string\n\tModel          string\n\tReasoning      string\n\tLowConcurrency string\n}\n\n// SessionContextState contains inspectable durable goal, TODO, and memory state.\ntype SessionContextState struct {\n')
          replace("internal/feature/desktop/state.go",
              '\tSubagents     []SubagentState\n\tContext       SessionContextState\n}',
              '\tSubagents     []SubagentState\n\tContext       SessionContextState\n\tRuntime       RuntimeSettingsState\n}')
          replace("internal/feature/desktop/state.go", '\tEventSessionMemoryUpdated\n)', '\tEventSessionMemoryUpdated\n\tEventSessionRuntimeUpdated\n)')
          replace("internal/feature/desktop/state.go", '\tMemory     MemoryState\n\tPermission PermissionRequest\n', '\tMemory     MemoryState\n\tRuntime    RuntimeSettingsState\n\tPermission PermissionRequest\n')
          replace("internal/feature/desktop/state.go",
              '\tcase EventSessionMemoryUpdated:\n\t\tif session := sessionByID(&next, event.SessionID); session != nil {\n\t\t\tsession.Context.Memory = cloneMemoryState(event.Memory)\n\t\t}\n\t}\n',
              '\tcase EventSessionMemoryUpdated:\n\t\tif session := sessionByID(&next, event.SessionID); session != nil {\n\t\t\tsession.Context.Memory = cloneMemoryState(event.Memory)\n\t\t}\n\tcase EventSessionRuntimeUpdated:\n\t\tif session := sessionByID(&next, event.SessionID); session != nil {\n\t\t\tsession.Runtime = event.Runtime\n\t\t}\n\t}\n')

          replace("internal/adapter/in/desktop/app.go", '\tpermissionActions *fyne.Container\n}',
              '\tpermissionActions *fyne.Container\n\tmodelProvider     *widget.Entry\n\tmodelID           *widget.Entry\n\tapplyModel        *widget.Button\n\treasoningSelect   *widget.Select\n\tlowSelect         *widget.Select\n\truntimeSync       bool\n}')
          replace("internal/adapter/in/desktop/app.go", '\tui.permissionPanel.Hide()\n\tui.send.Disable()\n\tui.stop.Disable()\n',
              '\tui.permissionPanel.Hide()\n\tui.send.Disable()\n\tui.stop.Disable()\n\tui.modelProvider = widget.NewEntry()\n\tui.modelProvider.SetPlaceHolder("provider")\n\tui.modelID = widget.NewEntry()\n\tui.modelID.SetPlaceHolder("model")\n\tui.applyModel = widget.NewButton("Apply", ui.setRuntimeModel)\n\tui.reasoningSelect = widget.NewSelect([]string{"auto", "none", "minimal", "low", "medium", "high", "xhigh", "max"}, func(value string) { if !ui.runtimeSync { ui.setRuntimeReasoning(value) } })\n\tui.lowSelect = widget.NewSelect([]string{"auto", "on", "off"}, func(value string) { if !ui.runtimeSync { ui.setRuntimeLowConcurrency(value) } })\n')
          replace("internal/adapter/in/desktop/app.go", '\theaderActions := container.NewHBox(ui.stop, ui.status)\n\theader := container.NewBorder(nil, nil, nil, headerActions,\n',
              '\truntimeControls := container.NewHBox(ui.modelProvider, ui.modelID, ui.applyModel, widget.NewLabel("Reasoning"), ui.reasoningSelect, widget.NewLabel("Low"), ui.lowSelect)\n\theaderActions := container.NewHBox(ui.stop, ui.status)\n\theader := container.NewBorder(runtimeControls, nil, nil, headerActions,\n')
          replace("internal/adapter/in/desktop/app.go", '\t\t\tprojected.Subagents = previous.Subagents\n', '\t\t\tprojected.Subagents = previous.Subagents\n\t\t\tprojected.Context = previous.Context\n\t\t\tprojected.Runtime = previous.Runtime\n')
          replace("internal/adapter/in/desktop/conversation.go",
              '\tif activeID != "" {\n\t\ta.refreshSessionContext(activeID, false)\n\t\ta.refreshSessionMemory(activeID, false)\n\t}\n\ta.renderActiveView()\n',
              '\tif activeID != "" {\n\t\ta.refreshSessionContext(activeID, false)\n\t\ta.refreshSessionMemory(activeID, false)\n\t\ta.refreshSessionRuntime(activeID, false)\n\t}\n\ta.renderActiveView()\n\ta.renderRuntimeControls()\n')
          PY

          cat > internal/feature/desktop/runtime_test.go <<'EOF'
          package desktop

          import "testing"

          func TestReduceUpdatesSessionRuntime(t *testing.T) {
              state := State{Sessions: []SessionState{{ID: "s1"}}}
              next := Reduce(state, Event{Kind: EventSessionRuntimeUpdated, SessionID: "s1", Runtime: RuntimeSettingsState{Provider: "protonman", Model: "qwen3.8-27b", Reasoning: "high", LowConcurrency: "on"}})
              got := next.Sessions[0].Runtime
              if got.Provider != "protonman" || got.Model != "qwen3.8-27b" || got.Reasoning != "high" || got.LowConcurrency != "on" { t.Fatalf("runtime = %#v", got) }
          }

          func TestRuntimeSurvivesContextUpdate(t *testing.T) {
              original := State{Sessions: []SessionState{{ID: "s1", Runtime: RuntimeSettingsState{Provider: "protonman", Model: "qwen"}}}}
              next := Reduce(original, Event{Kind: EventSessionContextUpdated, SessionID: "s1", Context: SessionContextState{Goal: "ship"}})
              if next.Sessions[0].Runtime != original.Sessions[0].Runtime { t.Fatalf("runtime lost: %#v", next.Sessions[0].Runtime) }
          }
          EOF

          gofmt -w internal/feature/desktop internal/adapter/in/desktop
          go test ./internal/feature/desktop
          rm -f .github/workflows/desktop-runtime-ui-finish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(desktop): wire typed runtime controls into Fyne"
          git push origin HEAD:feat/desktop-app
