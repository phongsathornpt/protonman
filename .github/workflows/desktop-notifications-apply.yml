name: Desktop native notifications apply

on:
  push:
    branches:
      - feat/desktop-app

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/desktop-app
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply and verify native notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace("internal/adapter/in/desktop/app.go", '\tclient *acpclient.Client\n', '\tclient     *acpclient.Client\n\tdesktopApp fyne.App\n')
          replace("internal/adapter/in/desktop/app.go", '\t\tctx:               ctx,\n\t\ttranscripts:       make(map[string]*strings.Builder),\n', '\t\tctx:               ctx,\n\t\tdesktopApp:        a,\n\t\ttranscripts:       make(map[string]*strings.Builder),\n')
          replace("internal/adapter/in/desktop/app.go", '\t\tif err != nil {\n\t\t\ta.appendTranscript(sessionID, "\\n\\n**Error:** "+err.Error()+"\\n")\n\t\t}\n\t\tfyne.Do(func() { a.list.Refresh() })\n', '\t\tif err != nil {\n\t\t\ta.appendTranscript(sessionID, "\\n\\n**Error:** "+err.Error()+"\\n")\n\t\t}\n\t\ta.notifyTurnFinished(sessionID, err)\n\t\tfyne.Do(func() { a.list.Refresh() })\n')
          replace("internal/adapter/in/desktop/permission.go", '\ta.mu.Unlock()\n\ta.refreshPermissionView()\n\n\tselect {\n', '\ta.mu.Unlock()\n\ta.refreshPermissionView()\n\ta.notifyPermission(item)\n\n\tselect {\n')
          PY

          cat > internal/adapter/in/desktop/notifications.go <<'EOF'
          //go:build desktop

          package desktop

          import (
              "fmt"
              "strings"

              "fyne.io/fyne/v2"

              desktopstate "github.com/phongsathornpt/protonman/internal/feature/desktop"
          )

          func (a *application) notifyPermission(item desktopstate.PermissionRequest) {
              title := strings.TrimSpace(item.Title)
              if title == "" {
                  title = "Permission required"
              }
              session := a.sessionNotificationLabel(item.SessionID)
              content := title
              if session != "" {
                  content = session + " · " + title
              }
              a.sendNativeNotification("Protonman needs permission", content)
          }

          func (a *application) notifyTurnFinished(sessionID string, turnErr error) {
              a.mu.Lock()
              active := a.state.ActiveSessionID == sessionID
              label := sessionNotificationLabelLocked(a.state, sessionID)
              a.mu.Unlock()
              if turnErr == nil && active {
                  return
              }
              if label == "" {
                  label = "Session " + shortID(sessionID)
              }
              if turnErr != nil {
                  a.sendNativeNotification("Protonman task failed", label+" · "+compactNotificationText(turnErr.Error()))
                  return
              }
              a.sendNativeNotification("Protonman task completed", label+" finished")
          }

          func (a *application) sessionNotificationLabel(sessionID string) string {
              a.mu.Lock()
              defer a.mu.Unlock()
              return sessionNotificationLabelLocked(a.state, sessionID)
          }

          func sessionNotificationLabelLocked(state desktopstate.State, sessionID string) string {
              for _, session := range state.Sessions {
                  if session.ID != sessionID {
                      continue
                  }
                  if title := strings.TrimSpace(session.Title); title != "" {
                      return title
                  }
                  if name := strings.TrimSpace(session.WorkspaceName); name != "" {
                      return name + " · " + shortID(session.ID)
                  }
                  return "Session " + shortID(session.ID)
              }
              return ""
          }

          func compactNotificationText(text string) string {
              text = strings.Join(strings.Fields(strings.TrimSpace(text)), " ")
              const max = 160
              runes := []rune(text)
              if len(runes) <= max {
                  return text
              }
              return fmt.Sprintf("%s…", string(runes[:max-1]))
          }

          func (a *application) sendNativeNotification(title, content string) {
              if a.desktopApp == nil {
                  return
              }
              title = strings.TrimSpace(title)
              content = strings.TrimSpace(content)
              if title == "" || content == "" {
                  return
              }
              a.desktopApp.SendNotification(&fyne.Notification{Title: title, Content: content})
          }
          EOF

          cat > internal/adapter/in/desktop/notifications_test.go <<'EOF'
          //go:build desktop

          package desktop

          import (
              "errors"
              "strings"
              "testing"
              "unicode/utf8"

              desktopstate "github.com/phongsathornpt/protonman/internal/feature/desktop"
          )

          func TestSessionNotificationLabelPrefersTitle(t *testing.T) {
              state := desktopstate.State{Sessions: []desktopstate.SessionState{{ID: "abcdef123456", Title: "Fix ACP", WorkspaceName: "protonman"}}}
              if got := sessionNotificationLabelLocked(state, "abcdef123456"); got != "Fix ACP" {
                  t.Fatalf("label = %q", got)
              }
          }

          func TestCompactNotificationTextBoundsErrors(t *testing.T) {
              input := strings.Repeat("failure ", 40)
              got := compactNotificationText(errors.New(input).Error())
              if utf8.RuneCountInString(got) > 160 {
                  t.Fatalf("notification text rune count = %d", utf8.RuneCountInString(got))
              }
              if strings.Contains(got, "  ") || strings.Contains(got, "\n") {
                  t.Fatalf("notification text not compacted: %q", got)
              }
          }
          EOF

          gofmt -w internal/adapter/in/desktop/app.go internal/adapter/in/desktop/permission.go internal/adapter/in/desktop/notifications.go internal/adapter/in/desktop/notifications_test.go
          go test ./internal/feature/desktop ./internal/adapter/in/acp ./internal/adapter/out/acpclient ./cmd/protonman
          sudo apt-get update >/dev/null
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols >/dev/null
          go test -tags desktop ./internal/adapter/in/desktop ./cmd/protonman-desktop
          rm -f .github/workflows/desktop-notifications-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(desktop): add native task notifications"
          git push origin HEAD:feat/desktop-app
