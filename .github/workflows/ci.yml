name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        run: make lint
      - name: Architecture (default graph)
        run: make test-architecture
      - name: Test
        run: make test
      - name: Build
        run: make build

  quality-macos:
    name: quality-macos
    # macOS arm64 is a published release target, so the suite must stay green
    # there. Host path handling differs (/var is a symlink to /private/var), which
    # Linux-only CI cannot observe.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Gio desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            wayland-protocols \
            xorg-dev
      - name: Architecture (desktop packages visible)
        run: make test-architecture-desktop
      - name: Build Desktop with GUI assets
        run: make desktop

  race:
    name: race
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-race
