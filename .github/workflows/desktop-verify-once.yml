name: Desktop verify once

on:
  push:
    branches: [feat/desktop-app]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/desktop-app
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - name: Verify Desktop and ACP runtime controls
        run: |
          go test ./internal/feature/desktop ./internal/adapter/in/acp ./internal/adapter/out/acpclient ./cmd/protonman
          go test -tags desktop ./internal/adapter/in/desktop ./cmd/protonman-desktop
      - name: Remove one-shot verifier
        run: |
          rm -f .github/workflows/desktop-verify-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(desktop): remove one-shot verifier"
          git push origin HEAD:feat/desktop-app
