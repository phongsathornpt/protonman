name: TUI format diff

on:
  pull_request:
    paths:
      - "internal/adapter/in/tui/runtime/panes.go"
      - "internal/adapter/in/tui/runtime/presentation_runtime.go"
      - ".github/workflows/tui-format-diff.yml"

permissions:
  contents: read

jobs:
  gofmt-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Show Go formatter diff
        run: |
          go version
          gofmt -d internal/adapter/in/tui/runtime/panes.go
          gofmt -d internal/adapter/in/tui/runtime/presentation_runtime.go
