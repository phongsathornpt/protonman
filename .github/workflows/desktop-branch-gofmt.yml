name: Desktop branch gofmt

on:
  push:
    branches:
      - feat/desktop-app

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/desktop-app
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format Desktop branch Go files
        run: |
          gofmt -w \
            internal/adapter/in/acp \
            internal/adapter/in/desktop \
            internal/adapter/out/acpclient \
            internal/app \
            internal/feature/desktop
          rm -f .github/workflows/desktop-branch-gofmt.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(desktop): gofmt feature branch"
          git push origin HEAD:feat/desktop-app
