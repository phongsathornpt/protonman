name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Test installer
        run: ./test/install/install_test.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: protonman-linux-amd64
            goos: linux
            goarch: amd64
          - target: protonman-linux-arm64
            goos: linux
            goarch: arm64
          - target: protonman-darwin-amd64
            goos: darwin
            goarch: amd64
          - target: protonman-darwin-arm64
            goos: darwin
            goarch: arm64
          - target: protonman-windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          plain_version="${version#v}"
          package="protonman_${plain_version}_${GOOS}_${GOARCH}"
          binary="protonman"
          if [[ "$GOOS" == "windows" ]]; then
            binary="protonman.exe"
          fi

          mkdir -p "dist/$package"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -trimpath \
            -ldflags "-s -w -X github.com/phongsathornpt/protonman/internal/base/buildinfo.version=$version" \
            -o "dist/$package/$binary" \
            ./cmd/protonman

          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            test "$("dist/$package/$binary" --version)" = "Protonman $plain_version"
          fi
          if [[ "$GOOS" == "windows" ]]; then
            (cd "dist/$package" && zip -q "../${package}.zip" "$binary")
          else
            (cd "dist/$package" && tar -czf "../${package}.tar.gz" "$binary")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: protonman-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and stage installer
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum protonman_* > checksums.txt
          cp ../install.sh install.sh
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="Protonman $tag"
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$title" \
              "${prerelease[@]}"
          fi

  install-smoke:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install published release asset
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/protonman-bin"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" \
            | sh -s -- --version "$GITHUB_REF_NAME" --bin-dir "$install_dir"
          expected="Protonman ${GITHUB_REF_NAME#v}"
          test "$("$install_dir/protonman" --version)" = "$expected"
      - name: Verify latest installer URL
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" \
            >/tmp/protonman-install.sh
          test -s /tmp/protonman-install.sh
          grep -q 'Install Protonman from GitHub Releases.' /tmp/protonman-install.sh
