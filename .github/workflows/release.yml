name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Test installer
        run: ./test/install/install_test.sh

  build-cli:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: protonman-cli-linux-amd64
            goos: linux
            goarch: amd64
          - target: protonman-cli-darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          plain_version="${version#v}"
          package="protonman_${plain_version}_${GOOS}_${GOARCH}"
          binary="protonman"

          mkdir -p "dist/$package"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -trimpath \
            -ldflags "-s -w -X github.com/phongsathornpt/protonman/internal/base/buildinfo.version=$version" \
            -o "dist/$package/$binary" \
            ./cmd/protonman

          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            test "$("dist/$package/$binary" --version)" = "Protonman $plain_version"
          fi
          (cd "dist/$package" && tar -czf "../${package}.tar.gz" "$binary")

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: protonman-desktop-linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: protonman-desktop-darwin-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - name: Build Desktop artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          plain_version="${version#v}"
          package="protonman-desktop_${plain_version}_${GOOS}_${GOARCH}"

          mkdir -p "dist/$package/libexec"

          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -trimpath \
            -ldflags "-s -w -X github.com/phongsathornpt/protonman/internal/base/buildinfo.version=$version" \
            -o "dist/$package/libexec/protonman" \
            ./cmd/protonman

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -tags desktop \
            -trimpath \
            -ldflags "-s -w -X github.com/phongsathornpt/protonman/internal/base/buildinfo.version=$version" \
            -o "dist/$package/protonman-desktop" \
            ./cmd/protonman-desktop

          cat >"dist/$package/run.sh" <<'EOF'
          #!/bin/sh
          set -eu
          root=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export PROTONMAN_BINARY="$root/libexec/protonman"
          exec "$root/protonman-desktop" "$@"
          EOF
          chmod +x "dist/$package/run.sh"

          (cd "dist/$package" && tar -czf "../${package}.tar.gz" protonman-desktop libexec/protonman run.sh)

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - build-cli
      - build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: protonman-*
          path: dist
          merge-multiple: true
      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          plain_version="${GITHUB_REF_NAME#v}"
          expected=(
            "protonman_${plain_version}_linux_amd64.tar.gz"
            "protonman_${plain_version}_darwin_arm64.tar.gz"
            "protonman-desktop_${plain_version}_linux_amd64.tar.gz"
            "protonman-desktop_${plain_version}_darwin_arm64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "missing release artifact: $asset" >&2
              printf 'downloaded artifacts:\n' >&2
              find . -maxdepth 1 -type f -printf '  %f\n' | sort >&2
              exit 1
            fi
          done
          sha256sum "${expected[@]}" > checksums.txt
          cp ../install.sh install.sh
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          plain_version="${tag#v}"
          title="Protonman $tag"
          assets=(
            "dist/protonman_${plain_version}_linux_amd64.tar.gz"
            "dist/protonman_${plain_version}_darwin_arm64.tar.gz"
            "dist/protonman-desktop_${plain_version}_linux_amd64.tar.gz"
            "dist/protonman-desktop_${plain_version}_darwin_arm64.tar.gz"
            "dist/checksums.txt"
            "dist/install.sh"
          )
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --generate-notes \
              --title "$title" \
              "${prerelease[@]}"
          fi

          for asset in "${assets[@]}"; do
            gh release upload "$tag" "$asset" --clobber
          done

          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            asset_name=$(basename "$asset")
            if ! grep -Fxq "$asset_name" <<<"$published_assets"; then
              echo "release asset missing after upload: $asset_name" >&2
              exit 1
            fi
          done

  install-smoke:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install published release asset
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/protonman-bin"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" \
            | sh -s -- --version "$GITHUB_REF_NAME" --bin-dir "$install_dir"
          expected="Protonman ${GITHUB_REF_NAME#v}"
          test "$("$install_dir/protonman" --version)" = "$expected"
      - name: Verify latest installer URL
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" \
            >/tmp/protonman-install.sh
          test -s /tmp/protonman-install.sh
          grep -q 'Install Protonman from GitHub Releases.' /tmp/protonman-install.sh
