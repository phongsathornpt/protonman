name: Desktop Fyne checksum fix

on:
  push:
    branches:
      - feat/desktop-app

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/desktop-app
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh module checksums and verify
        run: |
          go mod tidy
          go test ./internal/feature/desktop ./internal/adapter/in/acp ./internal/adapter/out/acpclient ./cmd/protonman
          rm -f .github/workflows/desktop-fyne-sum-fix.yml .github/workflows/desktop-verify-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum .github/workflows
          git commit -m "build(desktop): sync Fyne module checksums"
          git push origin HEAD:feat/desktop-app
