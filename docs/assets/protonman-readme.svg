<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">protonMAN terminal interface</title>
  <desc id="desc">A macOS-style dark terminal window showing the protonMAN coding agent interface.</desc>
  <defs>
    <linearGradient id="titlebar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#26272a"/>
      <stop offset="1" stop-color="#1f2022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f6f7f8"/>
  <g filter="url(#shadow)">
    <rect x="44" y="44" width="1112" height="632" rx="18" fill="#17181a" stroke="#3b3d41"/>
    <path d="M62 44h1076a18 18 0 0 1 18 18v45H44V62a18 18 0 0 1 18-18z" fill="url(#titlebar)"/>
  </g>

  <circle cx="78" cy="76" r="10" fill="#ff5f57"/>
  <circle cx="111" cy="76" r="10" fill="#febc2e"/>
  <circle cx="144" cy="76" r="10" fill="#28c840"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
    <text x="185" y="83" font-size="19" font-weight="600" fill="#b7bac1">gg — protonman — protonman — 115×42</text>

    <g fill="#ff9d2e" font-size="22">
      <text x="77" y="145"> /</text>
      <text x="68" y="170">/  </text>
      <text x="62" y="195">&lt;----&gt;</text>
      <text x="67" y="220">/|__|</text>
    </g>

    <text x="166" y="151" font-size="22" font-weight="700" fill="#ff9d2e">protonMAN</text>
    <text x="166" y="181" font-size="20" fill="#c7cad1">proton/muse-spark-1.3-contributor ·</text>
    <circle cx="548" cy="174" r="6" fill="#8c96a5"/>
    <text x="565" y="181" font-size="20" fill="#8c96a5">vision</text>
    <text x="166" y="217" font-size="19" fill="#a7abb3">~</text>

    <line x1="64" y1="244" x2="1136" y2="244" stroke="#7a818b" stroke-width="1.5"/>

    <line x1="64" y1="594" x2="1136" y2="594" stroke="#7a818b" stroke-width="1.5"/>
    <text x="64" y="626" font-size="22" font-weight="700" fill="#ff9d2e">&gt;</text>
    <line x1="64" y1="646" x2="188" y2="646" stroke="#ff9d2e" stroke-width="2"/>
    <line x1="188" y1="646" x2="1136" y2="646" stroke="#2a2c31" stroke-width="2"/>

    <text x="78" y="668" font-size="17" font-weight="700" fill="#ff9d2e">enter send · ctrl+j new line</text>
    <text x="342" y="668" font-size="17" fill="#d9dce2">· ? for shortcuts</text>
    <text x="1015" y="668" font-size="17" fill="#959aa5">auto · ask</text>
  </g>
</svg>