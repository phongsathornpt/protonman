<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">protonMAN terminal interface</title>
  <desc id="desc">A dark macOS-style protonMAN terminal window on a transparent background.</desc>
  <defs>
    <linearGradient id="titlebar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#24272b"/>
      <stop offset="1" stop-color="#1d2024"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="18" y="18" width="1164" height="564" rx="20" fill="#14161b" stroke="#3a3e45" stroke-width="1.5"/>
    <path d="M38 18h1124a20 20 0 0 1 20 20v48H18V38a20 20 0 0 1 20-20z" fill="url(#titlebar)"/>
  </g>

  <circle cx="50" cy="52" r="10" fill="#ff5f57"/>
  <circle cx="82" cy="52" r="10" fill="#febc2e"/>
  <circle cx="114" cy="52" r="10" fill="#28c840"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace">
    <text x="155" y="59" font-size="19" font-weight="600" fill="#b8bdc7">gg — protonman — protonman — protonman — 115×42</text>

    <g fill="#ff9d2e" font-size="24" font-weight="600">
      <text x="66" y="130">   /\</text>
      <text x="66" y="158">  /__\</text>
      <text x="66" y="186">&lt;____&gt;</text>
      <text x="66" y="214"> /|__|\</text>
    </g>

    <text x="190" y="132" font-size="23" font-weight="700" fill="#ff9d2e">protonMAN</text>
    <text x="190" y="164" font-size="20" fill="#c8ccd5">proton/muse-spark-1.3-contributor ·</text>
    <circle cx="586" cy="157" r="6" fill="#98a2b3"/>
    <text x="603" y="164" font-size="20" fill="#98a2b3">vision</text>
    <text x="190" y="202" font-size="19" fill="#9aa1ad">~</text>

    <line x1="42" y1="232" x2="1158" y2="232" stroke="#737b87" stroke-width="1.5"/>

    <line x1="42" y1="500" x2="1158" y2="500" stroke="#737b87" stroke-width="1.5"/>
    <text x="42" y="535" font-size="23" font-weight="700" fill="#ff9d2e">&gt;</text>

    <line x1="42" y1="555" x2="190" y2="555" stroke="#ff9d2e" stroke-width="2"/>
    <line x1="190" y1="555" x2="1158" y2="555" stroke="#2b2f36" stroke-width="2"/>

    <text x="58" y="577" font-size="17" font-weight="700" fill="#ff9d2e">enter send · ctrl+j new line</text>
    <text x="337" y="577" font-size="17" fill="#d9dde4">· ? for shortcuts</text>
    <text x="1034" y="577" font-size="17" fill="#969daa">auto · ask</text>
  </g>
</svg>